<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Made in Maglie • Admin</title>
<style>
:root{--blue:#102f57;--gold:#c59a48;--cream:#f7f3ec;--ink:#162235;--muted:#667085;--white:#fff;--red:#b42318}
*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--cream);color:var(--ink)}
header{background:var(--blue);color:#fff;padding:18px 24px;display:flex;align-items:center;justify-content:space-between;gap:16px}
header h1{margin:0;font-size:22px}header small{opacity:.8}main{max-width:1180px;margin:30px auto;padding:0 18px}
.card{background:#fff;border-radius:18px;padding:22px;box-shadow:0 8px 30px rgba(16,47,87,.08);margin-bottom:20px}
.hidden{display:none!important}.login{max-width:430px;margin:70px auto}
label{display:block;font-weight:700;margin:13px 0 7px}input,select,textarea{width:100%;border:1px solid #d0d5dd;border-radius:10px;padding:12px;font:inherit}
button{border:0;border-radius:10px;padding:11px 15px;cursor:pointer;font-weight:700}.primary{background:var(--blue);color:#fff}.secondary{background:#eef2f6;color:var(--blue)}.danger{background:#fee4e2;color:var(--red)}
.toolbar{display:grid;grid-template-columns:1fr 220px auto;gap:12px;align-items:end}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.stat{padding:18px;border-radius:14px;background:#f8fafc}.stat b{display:block;font-size:28px;margin-top:5px}
.ticket{border:1px solid #e4e7ec;border-radius:16px;padding:18px;margin-top:14px}.ticket-head{display:flex;justify-content:space-between;gap:15px;align-items:flex-start}
.ticket h3{margin:0 0 7px}.meta{color:var(--muted);font-size:14px;line-height:1.6}.description{white-space:pre-wrap;margin:15px 0;line-height:1.55}
.badge{display:inline-block;border-radius:999px;padding:6px 10px;font-size:12px;font-weight:700;background:#eef2f6}.badge.nuovo{background:#e8f1ff;color:#164e8a}.badge.invalutazione{background:#fff4d6;color:#8a5a00}.badge.inlavorazione{background:#e9e2ff;color:#5b21b6}.badge.completato{background:#dcfce7;color:#166534}
.actions{display:flex;gap:9px;flex-wrap:wrap;align-items:center}.actions select{width:auto;min-width:170px}.error{color:var(--red);background:#fff1f0;padding:10px 12px;border-radius:10px;margin-top:12px}.empty{padding:35px;text-align:center;color:var(--muted)}
#newTicketNotification{position:fixed;top:80px;right:20px;z-index:9999;background:var(--blue);color:#fff;padding:16px 20px;border-radius:14px;box-shadow:0 10px 30px rgba(0,0,0,.18);display:flex;flex-direction:column;gap:4px;font-size:15px;animation:slideIn .3s ease}
@keyframes slideIn{from{opacity:0;transform:translateX(30px)}to{opacity:1;transform:translateX(0)}}
@media(max-width:800px){.stats{grid-template-columns:repeat(2,1fr)}.toolbar{grid-template-columns:1fr}}
</style>
</head>
<body>
<header><div><h1>Made in Maglie • Admin</h1><small>Gestione suggerimenti e ticket</small></div><button id="logoutBtn" class="danger hidden">Esci</button></header>
<main>
<section id="loginSection" class="card login">
<h2>Accesso amministratore</h2><p class="meta">Accedi con l'account amministratore di Made in Maglie.</p>
<form id="loginForm"><label for="loginEmail">Email</label><input id="loginEmail" type="email" required autocomplete="email">
<label for="loginPassword">Password</label><input id="loginPassword" type="password" required autocomplete="current-password">
<button class="primary" type="submit" style="margin-top:16px;width:100%">Accedi</button><div id="loginError"></div></form>
</section>
<section id="adminSection" class="hidden">
<div class="stats"><div class="stat">Totali<b id="statTotal">0</b></div><div class="stat">Nuovi<b id="statNew">0</b></div><div class="stat">In lavorazione<b id="statWorking">0</b></div><div class="stat">Completati<b id="statDone">0</b></div></div>
<div class="card"><div class="toolbar"><div><label for="searchInput">Cerca</label><input id="searchInput" placeholder="Titolo, nome, email, descrizione..."></div>
<div><label for="filterStatus">Stato</label><select id="filterStatus"><option value="">Tutti</option><option value="nuovo">Nuovo</option><option value="in valutazione">In valutazione</option><option value="in lavorazione">In lavorazione</option><option value="completato">Completato</option></select></div>
<button id="refreshBtn" class="secondary">↻ Aggiorna</button></div></div>
<div id="ticketsContainer"></div>
</section>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL="https://mjfciizbtoiruokdiqef.supabase.co";
const SUPABASE_KEY="sb_publishable_dqzihDMJlD5uPK7u080DpA_pdE9jKdf";
const supabaseClient=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const loginSection=document.getElementById("loginSection"),adminSection=document.getElementById("adminSection"),loginForm=document.getElementById("loginForm"),loginError=document.getElementById("loginError"),logoutBtn=document.getElementById("logoutBtn"),refreshBtn=document.getElementById("refreshBtn"),searchInput=document.getElementById("searchInput"),filterStatus=document.getElementById("filterStatus"),ticketsContainer=document.getElementById("ticketsContainer");
let tickets=[],realtimeChannel=null;
function escapeHtml(v){return String(v??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#039;")}
function statusClass(v){return String(v||"").replace(/\s+/g,"").toLowerCase()}
function formatDate(v){if(!v)return"Data non disponibile";const d=new Date(v);return Number.isNaN(d.getTime())?v:d.toLocaleString("it-IT",{dateStyle:"medium",timeStyle:"short"})}
function updateStats(){document.getElementById("statTotal").textContent=tickets.length;document.getElementById("statNew").textContent=tickets.filter(t=>t.status==="nuovo").length;document.getElementById("statWorking").textContent=tickets.filter(t=>t.status==="in lavorazione"||t.status==="in valutazione").length;document.getElementById("statDone").textContent=tickets.filter(t=>t.status==="completato").length}
async function loadTickets(){const{data,error}=await supabaseClient.from("tickets").select("*").order("created_at",{ascending:false});if(error){ticketsContainer.innerHTML=`<div class="card error">Errore: ${escapeHtml(error.message)}</div>`;return}tickets=data||[];updateStats();render()}
function render(){const q=searchInput.value.trim().toLowerCase(),status=filterStatus.value,filtered=tickets.filter(t=>{const text=[t.title,t.name,t.email,t.description,t.category,t.page_url].join(" ").toLowerCase();return(!q||text.includes(q))&&(!status||t.status===status)});if(!filtered.length){ticketsContainer.innerHTML='<div class="card empty">Nessun ticket trovato.</div>';return}
ticketsContainer.innerHTML=filtered.map(t=>{const p=t.attachment_path||t.file_path||t.attachment||null;return`<article class="ticket"><div class="ticket-head"><div><h3>${escapeHtml(t.title||"Senza titolo")}</h3><div class="meta"><strong>${escapeHtml(t.name||"Nome non indicato")}</strong> · ${escapeHtml(t.email||"Email non indicata")}<br>Categoria: ${escapeHtml(t.category||"Altro")}<br>Ricevuto: ${escapeHtml(formatDate(t.created_at))}</div></div><span class="badge ${statusClass(t.status)}">${escapeHtml(t.status||"nuovo")}</span></div><div class="description">${escapeHtml(t.description||"")}</div>${p?`<a href="#" class="attachment" data-attachment="${escapeHtml(p)}">📎 Apri allegato</a>`:""}<div class="actions" style="margin-top:16px"><select data-status-id="${escapeHtml(t.id)}"><option value="nuovo" ${t.status==="nuovo"?"selected":""}>Nuovo</option><option value="in valutazione" ${t.status==="in valutazione"?"selected":""}>In valutazione</option><option value="in lavorazione" ${t.status==="in lavorazione"?"selected":""}>In lavorazione</option><option value="completato" ${t.status==="completato"?"selected":""}>Completato</option></select><button class="primary" data-save-id="${escapeHtml(t.id)}">Salva stato</button></div></article>`}).join("");
document.querySelectorAll("[data-save-id]").forEach(btn=>btn.addEventListener("click",async()=>{const id=btn.dataset.saveId,select=document.querySelector(`[data-status-id="${CSS.escape(id)}"]`);btn.disabled=true;const{error}=await supabaseClient.from("tickets").update({status:select.value}).eq("id",id);btn.disabled=false;if(error){alert("Errore: "+error.message);return}await loadTickets()}));
document.querySelectorAll("[data-attachment]").forEach(a=>a.addEventListener("click",async e=>{e.preventDefault();const{data,error}=await supabaseClient.storage.from("ticket-allegati").createSignedUrl(a.dataset.attachment,300);if(error){alert("Impossibile aprire l'allegato: "+error.message);return}window.open(data.signedUrl,"_blank","noopener")}))
}
function showNewTicketNotification(){let n=document.getElementById("newTicketNotification");if(!n){n=document.createElement("div");n.id="newTicketNotification";document.body.appendChild(n)}n.innerHTML="🔔 <strong>Nuovo ticket ricevuto</strong><span>La lista è stata aggiornata automaticamente.</span>";clearTimeout(n._timer);n._timer=setTimeout(()=>n.remove(),5000)}
function startRealtime(){if(realtimeChannel)supabaseClient.removeChannel(realtimeChannel);realtimeChannel=supabaseClient.channel("admin-tickets").on("postgres_changes",{event:"*",schema:"public",table:"tickets"},async payload=>{await loadTickets();if(payload.eventType==="INSERT")showNewTicketNotification()}).subscribe(status=>console.log("Realtime:",status))}
function stopRealtime(){if(realtimeChannel){supabaseClient.removeChannel(realtimeChannel);realtimeChannel=null}}
function showAdmin(){loginSection.classList.add("hidden");adminSection.classList.remove("hidden");logoutBtn.classList.remove("hidden");loadTickets();startRealtime()}
function showLogin(){loginSection.classList.remove("hidden");adminSection.classList.add("hidden");logoutBtn.classList.add("hidden");stopRealtime()}
loginForm.addEventListener("submit",async e=>{e.preventDefault();loginError.innerHTML="";const email=document.getElementById("loginEmail").value.trim(),password=document.getElementById("loginPassword").value;const{error}=await supabaseClient.auth.signInWithPassword({email,password});if(error){loginError.innerHTML=`<div class="error">${escapeHtml(error.message)}</div>`;return}showAdmin()});
logoutBtn.addEventListener("click",async()=>{await supabaseClient.auth.signOut();showLogin()});
refreshBtn.addEventListener("click",loadTickets);searchInput.addEventListener("input",render);filterStatus.addEventListener("change",render);
supabaseClient.auth.getSession().then(({data})=>data.session?showAdmin():showLogin());
</script>
</body>
</html>
