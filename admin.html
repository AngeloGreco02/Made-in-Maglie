<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Made in Maglie | Admin</title>
<style>
:root{--blue:#102f57;--gold:#c59a48;--cream:#f7f3ec;--ink:#162235;--muted:#667085;--border:#d9dee7;--green:#18794e;--red:#b42318}
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:var(--cream);color:var(--ink)}
header{background:var(--blue);color:#fff;padding:18px 28px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:5}
.brand{font-size:22px;font-weight:800}.brand span{color:#f0c96a}button{border:0;border-radius:10px;padding:11px 16px;cursor:pointer;font-weight:700}
.logout{background:#fff;color:var(--blue)}main{max-width:1400px;margin:auto;padding:30px 20px}
.login-card,.panel{background:#fff;border-radius:20px;padding:28px;box-shadow:0 8px 30px rgba(16,47,87,.08)}
.login-card{max-width:500px;margin:70px auto}h1,h2{color:var(--blue);margin-top:0}.sub{color:var(--muted);margin-bottom:24px}
label{display:block;font-weight:700;margin:16px 0 7px}input,select{width:100%;padding:13px;border:1px solid var(--border);border-radius:10px;font-size:16px;background:#fff}
.primary{width:100%;margin-top:20px;background:var(--blue);color:#fff;font-size:16px}.error{display:none;margin-top:15px;padding:13px;border-radius:10px;background:#fdecec;color:var(--red);font-weight:700}
.toolbar{display:grid;grid-template-columns:1fr 220px 140px;gap:12px;margin-bottom:20px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px}.stat{background:#fff;border-radius:14px;padding:18px;box-shadow:0 5px 20px rgba(16,47,87,.06)}
.stat strong{display:block;font-size:28px;color:var(--blue)}.stat span{color:var(--muted)}
.tickets{display:grid;gap:14px}.ticket{border:1px solid var(--border);border-radius:15px;padding:18px;background:#fff}
.ticket-top{display:flex;justify-content:space-between;gap:15px}.ticket-code{font-weight:800;color:var(--gold);font-size:14px}
.ticket-title{font-size:20px;font-weight:800;margin:5px 0;color:var(--blue)}.meta{color:var(--muted);font-size:14px;line-height:1.6}
.description{margin:15px 0;padding:14px;background:#f8fafc;border-radius:10px;white-space:pre-wrap}
.actions{display:flex;flex-wrap:wrap;gap:10px;align-items:center}.status{border-radius:999px;padding:7px 12px;font-size:13px;font-weight:800}
.status.nuovo{background:#e8f1ff;color:#175cd3}.status.in-valutazione{background:#fff4d6;color:#a66b00}.status.in-lavorazione{background:#fff0df;color:#b45309}.status.completato{background:#e8f7ef;color:#18794e}.status.archiviato{background:#edf0f3;color:#475467}
.status-select{width:auto;min-width:190px}.attachment{background:var(--blue);color:#fff}.page-link{color:var(--blue);font-weight:700;text-decoration:none}
.empty,.loading{text-align:center;color:var(--muted);padding:40px}.hidden{display:none!important}
@media(max-width:800px){.toolbar,.stats{grid-template-columns:1fr}.ticket-top{flex-direction:column}header{padding:15px}main{padding:18px 12px}}
</style>
</head>
<body>
<header><div class="brand">Made in <span>Maglie</span> · Admin</div><button id="logoutBtn" class="logout hidden">Esci</button></header>
<main>
<section id="loginSection" class="login-card">
<h1>Pannello amministratore</h1><p class="sub">Accedi per gestire i ticket di Made in Maglie.</p>
<form id="loginForm">
<label>Email</label><input id="email" type="email" autocomplete="username" required>
<label>Password</label><input id="password" type="password" autocomplete="current-password" required>
<button class="primary" type="submit">Accedi</button><div id="loginError" class="error"></div>
</form></section>

<section id="adminSection" class="hidden">
<div class="stats">
<div class="stat"><strong id="totalCount">0</strong><span>Totale ticket</span></div>
<div class="stat"><strong id="newCount">0</strong><span>Nuovi</span></div>
<div class="stat"><strong id="workCount">0</strong><span>In lavorazione</span></div>
<div class="stat"><strong id="doneCount">0</strong><span>Completati</span></div>
</div>
<div class="panel"><h2>Ticket</h2><p class="sub">Gestisci le richieste ricevute dal sito.</p>
<div class="toolbar"><input id="search" type="search" placeholder="Cerca per nome, email, titolo...">
<select id="filterStatus"><option value="">Tutti gli stati</option><option value="nuovo">Nuovo</option><option value="in-valutazione">In valutazione</option><option value="in-lavorazione">In lavorazione</option><option value="completato">Completato</option><option value="archiviato">Archiviato</option></select>
<button id="refreshBtn" type="button">↻ Aggiorna</button></div>
<div id="ticketList" class="tickets"><div class="loading">Caricamento ticket...</div></div>
</div></section>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL="https://mjfciizbtoiruokdiqef.supabase.com";
const SUPABASE_KEY="sb_publishable_dqzihDMJlD5uPK7u080DpA_pdE9jKdf";
const supabaseClient=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const loginSection=document.getElementById("loginSection"),adminSection=document.getElementById("adminSection"),logoutBtn=document.getElementById("logoutBtn"),loginForm=document.getElementById("loginForm"),loginError=document.getElementById("loginError"),ticketList=document.getElementById("ticketList"),searchInput=document.getElementById("search"),filterStatus=document.getElementById("filterStatus");
let tickets=[];
function esc(v){return String(v??"").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#039;")}
function date(v){return v?new Date(v).toLocaleString("it-IT",{dateStyle:"short",timeStyle:"short"}):""}
function label(s){return({"nuovo":"Nuovo","in-valutazione":"In valutazione","in-lavorazione":"In lavorazione","completato":"Completato","archiviato":"Archiviato"})[s]||"Nuovo"}
function attachment(t){return t.attachment_path||t.attachment||t.file_path||t.allegato_path||null}
function stats(){totalCount.textContent=tickets.length;newCount.textContent=tickets.filter(t=>(t.status||"nuovo")==="nuovo").length;workCount.textContent=tickets.filter(t=>t.status==="in-lavorazione").length;doneCount.textContent=tickets.filter(t=>t.status==="completato").length}
function render(){
 const q=searchInput.value.trim().toLowerCase(),s=filterStatus.value;
 const list=tickets.filter(t=>{const text=[t.name,t.email,t.title,t.category,t.description].join(" ").toLowerCase();return(!q||text.includes(q))&&(!s||(t.status||"nuovo")===s)});
 if(!list.length){ticketList.innerHTML='<div class="empty">Nessun ticket trovato.</div>';return}
 ticketList.innerHTML=list.map(t=>{const st=t.status||"nuovo",a=attachment(t);return `<article class="ticket"><div class="ticket-top"><div><div class="ticket-code">TICKET #${esc(t.id)}</div><div class="ticket-title">${esc(t.title||"Senza titolo")}</div><div class="meta">${esc(t.name||"")} · ${esc(t.email||"")}<br>${esc(t.category||"Altro")} · ${date(t.created_at)}</div></div><span class="status ${esc(st)}">${esc(label(st))}</span></div><div class="description">${esc(t.description||"")}</div><div class="actions"><select class="status-select" data-id="${esc(t.id)}"><option value="nuovo" ${st==="nuovo"?"selected":""}>Nuovo</option><option value="in-valutazione" ${st==="in-valutazione"?"selected":""}>In valutazione</option><option value="in-lavorazione" ${st==="in-lavorazione"?"selected":""}>In lavorazione</option><option value="completato" ${st==="completato"?"selected":""}>Completato</option><option value="archiviato" ${st==="archiviato"?"selected":""}>Archiviato</option></select>${a?`<button type="button" class="attachment" data-attachment="${esc(a)}">📎 Apri allegato</button>`:""}${t.page_url?`<a class="page-link" href="${esc(t.page_url)}" target="_blank" rel="noopener">Apri pagina segnalata ↗</a>`:""}</div></article>`}).join("");
 document.querySelectorAll(".status-select").forEach(x=>x.addEventListener("change",e=>updateStatus(e.target.dataset.id,e.target.value)));
 document.querySelectorAll(".attachment").forEach(x=>x.addEventListener("click",()=>openAttachment(x.dataset.attachment)));
}
async function loadTickets(){
 ticketList.innerHTML='<div class="loading">Caricamento ticket...</div>';
 const {data,error}=await supabaseClient.from("tickets").select("*").order("created_at",{ascending:false});
 if(error){ticketList.innerHTML=`<div class="error" style="display:block">Errore: ${esc(error.message)}</div>`;return}
 tickets=data||[];stats();render();
}
async function updateStatus(id,status){
 const {error}=await supabaseClient.from("tickets").update({status}).eq("id",id);
 if(error){alert("Impossibile aggiornare lo stato: "+error.message);return}
 const t=tickets.find(x=>String(x.id)===String(id));if(t)t.status=status;stats();render();
}
async function openAttachment(path){
 const {data,error}=await supabaseClient.storage.from("ticket-allegati").createSignedUrl(path,300);
 if(error){alert("Impossibile aprire l'allegato: "+error.message);return}
 if(data?.signedUrl)window.open(data.signedUrl,"_blank","noopener");
}
function showAdmin(){loginSection.classList.add("hidden");adminSection.classList.remove("hidden");logoutBtn.classList.remove("hidden");loadTickets()}
function showLogin(){loginSection.classList.remove("hidden");adminSection.classList.add("hidden");logoutBtn.classList.add("hidden")}
loginForm.addEventListener("submit",async e=>{e.preventDefault();loginError.style.display="none";const {error}=await supabaseClient.auth.signInWithPassword({email:document.getElementById("email").value.trim(),password:document.getElementById("password").value});if(error){loginError.textContent="Accesso non riuscito: "+error.message;loginError.style.display="block";return}showAdmin()});
logoutBtn.addEventListener("click",async()=>{await supabaseClient.auth.signOut();showLogin()});
refreshBtn.addEventListener("click",loadTickets);searchInput.addEventListener("input",render);filterStatus.addEventListener("change",render);
supabaseClient.auth.onAuthStateChange((_e,session)=>session?showAdmin():showLogin());
(async()=>{const {data}=await supabaseClient.auth.getSession();data.session?showAdmin():showLogin()})();
</script>
</body>
</html>
